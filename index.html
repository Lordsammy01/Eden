<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EDEN – Phase 1 prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F6FB; --screen:#F4F6FB; --surface:#FFFFFF; --ink:#121530; --muted:#8891A8; --line:#EEF0F6;
  --brand:#14126B; --brandText:#14126B; --hdr:#14126B; --hdrGrad:linear-gradient(135deg,#1C1878 0%,#14126B 55%,#0E0C4E 100%); --tint:#E9ECFB; --amber:#E8C94A; --amberText:#8A6A14;
  --ok:#1C7A41; --okBg:rgba(43,81,52,.12); --danger:#D23F3F; --dangerBg:rgba(210,63,63,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0B1F; --screen:#0E0F2A; --surface:#161833; --ink:#EDEBFA; --muted:#9A9BC4; --line:#2A2B52;
    --brand:#8783E0; --brandText:#B3B0EE; --hdr:#14126B; --hdrGrad:linear-gradient(135deg,#1C1878 0%,#14126B 55%,#0E0C4E 100%); --tint:#211F55; --amber:#E8C94A; --amberText:#F3D978;
    --ok:#3FA868; --okBg:rgba(63,168,104,.18); --danger:#F06A6A; --dangerBg:rgba(240,106,106,.16);
  }
}
:root[data-theme="dark"]{
  --bg:#0A0B1F; --screen:#0E0F2A; --surface:#161833; --ink:#EDEBFA; --muted:#9A9BC4; --line:#2A2B52;
  --brand:#8783E0; --brandText:#B3B0EE; --hdr:#14126B; --hdrGrad:linear-gradient(135deg,#1C1878 0%,#14126B 55%,#0E0C4E 100%); --tint:#211F55; --amber:#E8C94A; --amberText:#F3D978;
  --ok:#3FA868; --okBg:rgba(63,168,104,.18); --danger:#F06A6A; --dangerBg:rgba(240,106,106,.16);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3,.disp{font-family:'Archivo Black','DM Sans',system-ui,sans-serif;letter-spacing:-.01em}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:24px;color:var(--brandText);letter-spacing:.02em}
.brand span{font-size:13px;color:var(--muted)}
.roles{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:999px}
.roles button{padding:7px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.roles button[aria-pressed="true"]{background:var(--brand);color:#fff}
.switches{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.sw input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;flex:none}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--ok)}
.sw input:checked::after{transform:translateX(14px)}
.link{color:var(--brandText);font-weight:700;font-size:13px}

/* stage */
.stage{display:flex;gap:36px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:28px 20px 48px}
.notes{width:320px;max-width:100%;padding-top:8px}
.notes h2{font-size:22px;line-height:1.15;margin-bottom:10px}
.notes p{color:var(--muted);margin-bottom:12px}
.notes .try{border-left:3px solid var(--amber);padding:2px 0 2px 12px;color:var(--ink)}
.notes .split{margin-top:14px;font-size:13px;color:var(--muted)}
.notes .split div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
.notes .split b{color:var(--ink)}

/* phone */
.phone{width:min(392px,100%);height:800px;border-radius:48px;background:#0A0E1D;padding:11px;flex:none;box-shadow:0 36px 60px -28px rgba(10,20,70,.55)}
.screen{position:relative;height:100%;border-radius:38px;overflow:hidden;background:var(--screen);display:flex;flex-direction:column;color:var(--ink)}
.tb{background:var(--hdrGrad);color:#fff;padding:0 18px 16px;flex:none}
.statusbar{display:flex;justify-content:space-between;padding:12px 8px 8px;font-size:12px;font-weight:700}
.tb-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tb .sm{font-size:13px;opacity:.75}
.tb .h1{font-family:'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:26px;line-height:1.1}
.tb .title{font-family:'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:20px;line-height:1.15}
.tb .sub{font-size:13px;opacity:.75}
.iconbtn{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff;flex:none}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,#2B5134,#14126B);color:#E8C94A;font-weight:800;display:grid;place-items:center;font-size:14px}
.walletchip{margin-top:14px;width:100%;display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.12);font-size:14px}
.walletchip span{display:flex;gap:8px;align-items:center;opacity:.9}
.walletchip b{font-family:'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif;font-size:18px}
.offline{display:flex;gap:8px;align-items:center;padding:8px 18px;background:var(--amber);color:#14126B;font-size:12.5px;font-weight:700;flex:none}
.scroll{flex:1;overflow-y:auto;padding:16px 16px 20px;-webkit-overflow-scrolling:touch}
.scroll h2{font-size:17px;margin:20px 2px 10px}
.nav{display:flex;flex:none;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px 14px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 0;position:relative}
.nav button[aria-current="page"]{color:var(--brandText)}
.nav button .navic{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;transition:all .15s ease}
.nav button[aria-current="page"] .navic{width:38px;height:38px;margin-top:-20px;background:linear-gradient(145deg,#1C1878,#14126B);color:#E8C94A;box-shadow:0 8px 16px -6px rgba(20,18,107,.55),0 0 0 5px var(--surface)}
.nav .dot{position:absolute;top:0;left:calc(50% + 6px);width:9px;height:9px;border-radius:50%;background:var(--amber);border:2px solid var(--surface)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.banner{width:100%;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(232,201,74,.16);border:1px solid rgba(232,201,74,.4)}
.banner b{display:block;font-size:14px}
.banner small{color:var(--muted);font-size:12px}
.bicon{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#F3D978,#E8C94A);color:#14126B;display:grid;place-items:center;flex:none}
.loc{width:100%;display:flex;gap:10px;align-items:center;padding:12px 14px;margin-top:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.loc span{flex:1}
.loc em{font-style:normal;color:var(--brandText);font-weight:700;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.tile{border-radius:16px;padding:12px;background:var(--surface);border:1px dashed var(--line);display:flex;flex-direction:column;gap:6px;min-height:92px;color:var(--muted)}
.tile b{font-size:13px;color:var(--ink)}
.tile small{font-size:11.5px}
.tile.hero{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;background:var(--brand);border:0;color:#fff;padding:16px;min-height:0}
.tile.hero b{color:#fff;font-family:'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif;font-size:19px;display:block}
.tile.hero small{color:rgba(255,255,255,.8);font-size:13px}
.tile.hero .ic{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#F3D978,#E8C94A);color:#14126B;display:grid;place-items:center;flex:none;box-shadow:inset 0 -2px 4px rgba(140,100,0,.2)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--tint);color:var(--brandText)}

.vrow{width:100%;display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:10px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.vrow.closed{opacity:.6}
.mono{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:16px;flex:none;background:hsl(var(--h) 70% 50% / .17);color:hsl(var(--h) 70% 42%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mono{color:hsl(var(--h) 85% 68%)}}
:root[data-theme="dark"] .mono{color:hsl(var(--h) 85% 68%)}
.vrow .meta{flex:1;min-width:0}
.vrow b{display:block;font-size:15px}
.vrow small{color:var(--muted);font-size:12.5px}
.vrow .tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}

.item{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.item b{display:block;font-size:15px}
.item small{color:var(--muted);font-size:12.5px;display:block}
.item .price{font-weight:700;font-size:14px;margin-top:2px}
.item.out{opacity:.5}
.qty{display:flex;align-items:center;gap:10px;background:var(--tint);border-radius:999px;padding:3px}
.qty button{width:28px;height:28px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--brandText)}
.qty span{min-width:14px;text-align:center;font-weight:700}
.addbtn{padding:7px 16px;border-radius:999px;background:var(--tint);color:var(--brandText);font-weight:700;font-size:13px}
.cartbar{flex:none;padding:10px 16px 18px;background:var(--surface);border-top:1px solid var(--line)}

.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:14px;border-radius:15px;background:var(--brand);color:#fff;font-weight:700;text-align:center;box-shadow:0 10px 20px -10px rgba(20,18,107,.5)}
.btn.amber{background:linear-gradient(135deg,#F3D978,#E8C94A);color:#14126B;box-shadow:0 10px 20px -12px rgba(199,154,30,.6)}
.btn.ghost{background:var(--tint);color:var(--brandText)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.sm{width:auto;padding:8px 14px;border-radius:10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-weight:700;font-size:16px}
.row .k{color:var(--muted)}
.note{display:flex;gap:10px;padding:11px 12px;border-radius:12px;font-size:13px;margin-top:10px}
.note.ok{background:var(--okBg);color:var(--ok)}
.note.warn{background:var(--dangerBg);color:var(--danger)}
.note.info{background:var(--tint);color:var(--brandText)}
.note b{font-weight:700}

/* tracker */
.route{padding:10px 8px 4px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.route svg{display:block;width:100%;height:auto}
.route-base{stroke:var(--line);stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round;fill:none}
.route-done{stroke:var(--amber);stroke-width:4;stroke-linecap:round;fill:none}
.node{fill:var(--surface);stroke:var(--brandText);stroke-width:2.5}
.node.on{fill:var(--brandText)}
.lbl{font-size:11px;fill:var(--muted);font-family:'Inter',sans-serif;text-anchor:middle}
.pulse{fill:var(--amber);opacity:.35;animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.6);opacity:.55}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.headline{font-family:'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:24px;line-height:1.15;margin:16px 2px 4px}
.subline{color:var(--muted);margin:0 2px 14px}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:8px 0;position:relative}
.steps li::before{content:"";position:absolute;left:11px;top:30px;bottom:-8px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .b{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface);color:transparent}
.steps li.done .b{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.now .b{border-color:var(--amber);background:var(--amber);color:#14126B}
.steps li span{flex:1;font-weight:500}
.steps li.todo span{color:var(--muted)}
.steps small{color:var(--muted);font-size:12px;display:block}
.steps time{font-size:12px;color:var(--muted)}

.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.c-amber{background:rgba(232,201,74,.2);color:var(--amberText)}
.c-brand{background:var(--tint);color:var(--brandText)}
.c-ok{background:var(--okBg);color:var(--ok)}
.c-bad{background:var(--dangerBg);color:var(--danger)}

.wcard{background:var(--hdrGrad);color:#fff;border-radius:24px;padding:22px;box-shadow:0 18px 34px -16px rgba(20,18,107,.55)}
.wcard small{opacity:.75}
.wcard .amt{font-family:'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:38px;line-height:1.1;margin:4px 0 14px}
.tx{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.tx small{display:block;color:var(--muted);font-size:12px}
.tx .pos{color:var(--ok);font-weight:700}
.ann{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.ann b{display:block;font-size:15px;margin-bottom:2px}
.ann p{color:var(--muted);font-size:14px}
.ann small{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--muted);font-size:12px}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:14px;width:auto;display:inline-flex;padding:10px 18px}

/* sheets */
.sheet-bg{position:absolute;inset:0;background:rgba(5,10,30,.55);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px 24px;max-height:85%;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:20px;margin-bottom:6px}
.sheet p{color:var(--muted);font-size:14px;margin-bottom:14px}
.opt{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;font-weight:500}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--tint)}
.opt small{color:var(--muted)}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.amts button{padding:11px 0;border-radius:12px;border:1px solid var(--line);text-align:center;font-weight:700;font-size:14px}
.amts button[aria-pressed="true"]{border-color:var(--brand);background:var(--tint);color:var(--brandText)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#121530;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
:root[data-theme="dark"] .toast{background:#EAF0FF;color:#121530}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toast{background:#EAF0FF;color:#121530}}

/* wide dashboards */
.wide{width:min(1120px,100%)}
.dash-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.dash-h h2{font-size:28px;line-height:1.1}
.dash-h p{color:var(--muted);max-width:60ch;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.stat small{color:var(--muted);font-size:13px}
.stat b{display:block;font-family:'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif;font-size:28px;line-height:1.2}
.stat i{font-style:normal;font-size:12px;color:var(--muted)}
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:820px){.kan{grid-template-columns:1fr}}
.col{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:12px;min-height:220px}
.col h3{font-size:16px;margin:2px 4px 2px}
.col>small{display:block;margin:0 4px 12px;color:var(--muted);font-size:12.5px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.ocard .hd{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.ocard ul{list-style:none;padding:0;font-size:14px;margin-bottom:8px}
.ocard li{display:flex;justify-content:space-between}
.ocard .to{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.acts{display:flex;gap:8px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.tabs button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.sel{padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.panel h3{font-size:17px;margin-bottom:10px}
.panel .scrollx{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
.field{display:block;margin-bottom:10px;font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;width:100%}
.check:last-child{border-bottom:0}
.box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;margin-top:1px}
.check.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.check.done span{color:var(--muted)}

function quote(){
  const lines = cartLines();
  const subtotal = lines.reduce((s, l) => s + l.price * l.qty, 0);
  const fee = locById(S.loc).fee;
  const batched = subtotal > 0 && S.orders.some(o => o.by !== 'you' && o.vendorId === S.cart.vendorId && o.loc === S.loc && ['placed','accepted','preparing'].includes(o.status));
  const delivery = fee - (batched ? 100 : 0);
  const service = 50;
  const total = subtotal + delivery + service;
  const vendor = Math.round(subtotal * .92);
  const rider = Math.round(delivery * .75);
  return {lines, subtotal, delivery, service, total, batched, vendor, rider, platform:total - vendor - rider, count:lines.reduce((s, l) => s + l.qty, 0)};
}

function stepIdx(s){ return {queued:-1, placed:0, accepted:1, preparing:2, ready:2, pickedup:3, delivered:4}[s] ?? -1; }
function miniMap(fromLabel, midLabel, toLabel, f, dead, ariaLabel){

  const L = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  const A = L(P0, P1, f), B = L(P1, P2, f), C = L(A, B, f);
  return `<div class="route"><svg viewBox="0 0 320 112" role="img" aria-label="${ariaLabel}">
    <path class="route-base" d="M34 66 Q160 -14 286 66"/>
    ${f > 0 ? `<path class="route-done" d="M34 66 Q${A[0].toFixed(1)} ${A[1].toFixed(1)} ${C[0].toFixed(1)} ${C[1].toFixed(1)}"/>` : ''}

    <circle class="node ${f >= 1 ? 'on' : ''}" cx="286" cy="66" r="8"/>
    ${!dead ? `<circle class="pulse" cx="${C[0].toFixed(1)}" cy="${C[1].toFixed(1)}" r="13"/><circle cx="${C[0].toFixed(1)}" cy="${C[1].toFixed(1)}" r="7" fill="#E8C94A" stroke="#fff" stroke-width="2.5"/>` : ''}
    <text class="lbl" x="34" y="94">${esc(fromLabel)}</text>
    <text class="lbl" x="160" y="52" style="opacity:.8">${esc(midLabel)}</text>
    <text class="lbl" x="286" y="94">${esc(toLabel)}</text>
  </svg></div>`;
}

function haversine(a, b){
  const R = 6371000, toRad = x => x * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat), dLon = toRad(b.lon - a.lon);
  const la1 = toRad(a.lat), la2 = toRad(b.lat);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtDist(m){ return m < 1000 ? `${Math.round(m)}m` : `${(m / 1000).toFixed(1)}km`; }
function geoBlock(targetId, targetName){
  const g = S.geo;
  if(g.status === 'granted'){
    const d = GEO_POINTS[targetId] ? fmtDist(haversine({lat:g.lat, lon:g.lon}, GEO_POINTS[targetId])) : null;
    return `<div class="techline">${ic('pin', 14)}<span>Live: ${g.lat.toFixed(4)}\u00b0, ${g.lon.toFixed(4)}\u00b0 (\u00b1${g.accuracy}m)${d ? ` \u00b7 ${d} from ${esc(targetName)}` : ''}</span></div><button class="link" style="font-size:12.5px" data-act="enableGeo">Refresh location</button>`;

  if(g.status === 'requesting') return `<div class="techline">${ic('pin', 14)}<span class="spin" style="width:14px;height:14px;border-width:2px"></span><span>Getting your location\u2026</span></div>`;

  return `<button class="btn sm ghost" style="margin-top:6px" data-act="enableGeo">${ic('pin', 14)} Share live location</button>`;
}

function handlePostMedia(file){
  if(!file) return;
  if(file.type.startsWith('image/')){
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900, scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        S.postAttachment = {type:'image', url:c.toDataURL('image/jpeg', .85)};
        render();
      };
      img.onerror = () => toast('That image couldn\'t be read');
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  } else if(file.type.startsWith('video/')){
    S.postAttachment = {type:'video', url:URL.createObjectURL(file)};
    render();
  } else {
    toast('Choose an image or video file');
  }
}

function facCard(x){
  const urgent = x.prio === 'Urgent' && x.status !== 'closed';
  const pick = S.facPick[x.id] || TECH_FOR[x.cat] || TECHS[0];

  if(x.status === 'received') action = `<div class="reqacts"><select data-facpick="${x.id}" aria-label="Choose a technician">${TECHS.map(t => `<option ${pick === t ? 'selected' : ''}>${t}</option>`).join('')}</select><button class="btn sm" data-act="facAssign" data-id="${x.id}">Assign</button></div>`;
  else if(x.status === 'assigned') action = `<button class="btn sm" data-act="facStart" data-id="${x.id}">Start work</button>`;
  else if(x.status === 'working') action = `<button class="btn sm amber" data-act="facComplete" data-id="${x.id}">Mark complete</button>`;
  else if(x.status === 'review') action = `<small style="color:var(--muted)">Waiting for ${esc(x.by)} to confirm</small>`;
  else action = `<span class="chip c-ok">Closed</span>`;
  return `<div class="ocard ${urgent ? 'urgent' : ''}"><div class="hd"><b>${x.id}</b>${urgent ? '<span class="fchip" style="background:var(--dangerBg);color:var(--danger)">Urgent</span>' : ''}</div>

}

/* ---------- render ---------- */
const app = document.getElementById('app');
let lastKey = '';
const PERSONAS = ['student','academic','nonacademic'];
function currentKey(){ return S.role + '|' + S.persona + '|' + S.stage + '|' + S.screen + '|' + S.vendorTab + '|' + S.authMode + '|' + (GATED.includes(S.role) ? S.session[S.role] + '' + S.launched[S.role] : 1); }
function renderRoles(){
  const roles = [['student','Student'],['academic','Academic staff'],['nonacademic','Non-academic staff'],['rider','Delivery intern'],['driver','Driver'],['vendor','Vendor'],['provider','Service provider'],['seller','Marketplace seller'],['admin','Management']];
  document.getElementById('roles').innerHTML = roles.map(r => `<button data-role="${r[0]}" aria-pressed="${S.role === r[0]}">${r[1]}${r[0] === 'admin' && pendingCount() ? `<span class="badge" aria-label="${pendingCount()} awaiting approval">${pendingCount()}</span>` : ''}</button>`).join('');
}
function render(){
  const sc = app.querySelector('.scroll, .pad');
  const st = sc ? sc.scrollTop : 0;
  const key = currentKey();
  const h = app.offsetHeight;
  if(h) app.style.minHeight = h + 'px';
  app.innerHTML =((GATED.includes(S.role) && !S.session[S.role]) ? (!S.launched[S.role] ? phoneLaunchWrap(S.role) : phoneGateWrap(S.role)) : PERSONAS.includes(S.role) ? phoneView() : S.role === 'rider' ? riderView() : S.role === 'driver' ? driverView() : S.role === 'vendor' ? vendorView() : S.role === 'provider' ? providerView() : S.role === 'seller' ? sellerView() : adminView()) + callOverlay();
  const sc2 = app.querySelector('.scroll, .pad');
  if(sc2 && key === lastKey) sc2.scrollTop = st;
  lastKey = key;
  app.style.minHeight = '';
  renderRoles();
  saveAuth();
}
function saveAuth(){
  try{
    localStorage.setItem('eden-auth', JSON.stringify({
      role:S.role, persona:S.persona, session:S.session, launched:S.launched,
      users:S.users, vendorView:S.vendorView, studentIn:S.stage === 'app'
    }));
  }catch(e){}
}
function loadAuth(){
  try{
    const raw = localStorage.getItem('eden-auth');
    if(!raw) return false;
    const snap = JSON.parse(raw);
    if(snap.session) Object.assign(S.session, snap.session);
    if(snap.launched) Object.assign(S.launched, snap.launched);
    if(snap.users) Object.assign(S.users, snap.users);
    if(snap.vendorView) S.vendorView = snap.vendorView;
    if(snap.studentIn){ S.stage = 'app'; S.tab = S.screen = 'home'; }
    if(snap.role) S.role = snap.role;
    if(snap.persona) S.persona = snap.persona;
    return (snap.studentIn && snap.role === 'student') || (GATED.includes(snap.role) && snap.session && snap.session[snap.role]);
  }catch(e){ return false; }
}
function softRender(){
  const a = document.activeElement;
  if(a && app.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && (a.dataset.model || a.dataset.form || a.dataset.note || a.dataset.facfield || a.dataset.svcfield || a.dataset.gate || a.dataset.forgot || a.hasAttribute('data-facmsg') || a.hasAttribute('data-ratecomment') || a.hasAttribute('data-chatmsg') || a.hasAttribute('data-phonefield') || a.hasAttribute('data-postfield') || a.hasAttribute('data-commentfield') || a.hasAttribute('data-dmfield') || a.hasAttribute('data-groupfield') || a.hasAttribute('data-peoplesearch') || a.hasAttribute('data-foodsearch') || a.hasAttribute('data-svcsearch') || a.hasAttribute('data-mktsearch'))) return;
  render();
}

  facStart(id){ const x = S.fac.find(y => y.id === id); if(x) { advanceFac(x, 'working'); render(); } },

  },

    const f = S.rideForm, t = rideTypeOf(f.type);

    if(S.rides.some(x => x.mine && x.persona === S.persona && ['requested', 'assigned', 'arriving', 'onboard'].includes(x.status))){ toast('You already have a ride in progress'); render(); return; }
    const r = {id:++S.rideSeq, type:f.type, pickup:f.pickup, drop:f.drop, fare:t.fare, mine:true, persona:S.persona, by:shortOf(S.user), status:'requested', driver:null, plate:null, rating:null, at:{requested:nowT()}};

    if(cur === 'student'){ S.stage = 'auth'; S.authMode = 'signin'; S.form = {name:'', email:'', id:'', pass:''}; S.tab = S.screen = 'home'; }
    S.gate = {email:'', pass:'', showPass:false, busy:false, err:'', notice:null};
    S.sheet = null; render(); window.scrollTo({top:0}); toast('Signed out');
  },
  theme(id){ applyTheme(id); render(); toast(id === 'system' ? 'Following your phone\'s setting' : `${id[0].toUpperCase() + id.slice(1)} mode on`); },
  notif(id, el){ S.notif[id] = el.checked; render(); },
  removeAv(){ delete AV[S.user.email]; saveAV(); render(); toast('Photo removed'); },
  tab(id){
    S.tab = id; S.screen = id; S.sheet = null;
    if(id === 'updates') announceVerseIfNew(S.role + ':' + S.persona);
    render();
  },
  openOpUpdates(){ S.sheet = {type:'opUpdates'}; announceVerseIfNew(S.role); render(); },
  back(){
    if(S.screen === 'cart') S.screen = 'menu';
    else if(S.screen === 'menu') S.screen = 'home';
    else if(S.screen === 'marketCart') S.screen = 'market';
    else if(S.screen === 'serviceBook') S.screen = 'serviceProviders';
    else if(S.screen === 'serviceProviders') S.screen = 'services';
    else if(S.screen === 'groupDetail') S.screen = 'social';
    else S.screen = S.tab;
    render();
  },
  go(id){ S.screen = id; render(); window.scrollTo({top:0}); },
  kitchens(){ const el = document.getElementById('kitchens'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); },
  vendor(id){
    if(S.closed[id]){ toast(`${vendorById(id).name} is closed right now`); return; }
    S.vendorId = id; S.screen = 'menu'; render();
  },
  add(id){
    const it = ALLITEMS.find(x => x.id === id);
    const vid = Object.keys(MENU).find(k => MENU[k].some(x => x.id === id));
    if(S.out[id]){ toast('That item is sold out'); return; }
    if(S.cart.vendorId && S.cart.vendorId !== vid){ S.cart = {vendorId:vid, q:{}}; toast(`Started a new cart for ${vendorById(vid).name}`); }
    S.cart.vendorId = vid;
    S.cart.q[id] = (S.cart.q[id] || 0) + 1;
    render();
  },
  dec(id){
    if(!S.cart.q[id]) return;
    S.cart.q[id] -= 1;
    if(S.cart.q[id] <= 0) delete S.cart.q[id];
    if(!Object.keys(S.cart.q).length){ S.cart.vendorId = null; S.screen = 'menu'; if(!S.vendorId) S.screen = 'home'; }
    render();
  },
  cart(){ S.screen = 'cart'; render(); },
  openLoc(){ S.sheet = {type:'loc'}; render(); },
  setLoc(id){ S.loc = id; S.sheet = null; render(); },
  closeSheet(){ if(S.paying) return; S.sheet = null; render(); },
  privacy(){ toast('The privacy notice would open here'); },
  support(){ toast('Support ticket opened. A person will reply in the app'); },
  topup(){ S.sheet = {type:'topup'}; render(); },
  amt(id){ S.amt = +id; render(); },
  pay(){
    if(S.offline || S.paying) return;
    const amt = S.amt; S.paying = true;
    const tx = {label:'Wallet top-up (Paystack)', amt, status:'Confirming', when:nowT()};
    S.txs.unshift(tx); render();
    setTimeout(() => { S.wallet += amt; tx.status = 'Confirmed'; S.paying = false; S.sheet = null; render(); toast(`${N(amt)} confirmed and added to your wallet`); }, 1700);
  },
  place(){
    const q = quote();
    if(!q.count || q.total > S.wallet) return;
    const o = {id:S.nextId++, vendorId:S.cart.vendorId, by:'you', persona:S.persona, items:q.lines.map(l => ({id:l.id, name:l.name, price:l.price, qty:l.qty})), loc:S.loc,
      subtotal:q.subtotal, delivery:q.delivery, service:q.service, total:q.total, riderPay:q.rider, batched:q.batched, at:{}, status:S.offline ? 'queued' : 'placed'};
    if(!S.offline) o.at.placed = nowT();
    S.orders.push(o);
    S.wallet -= q.total;
    S.txs.unshift({label:`Order #${o.id} · ${vendorById(o.vendorId).name}`, amt:-q.total, status:S.offline ? 'Held until sent' : 'Paid', when:nowT()});
    S.vendorView = o.vendorId;
    S.cart = {vendorId:null, q:{}};
    S.activeId = o.id; S.tab = 'orders'; S.screen = 'track';
    render();
    toast(S.offline ? 'Saved. It will send when you\'re online' : 'Order sent to the kitchen');
  },
  open(id){ S.activeId = +id; S.screen = 'track'; render(); },
  cancel(id){
    const o = S.orders.find(x => x.id === +id);
    if(!o || !['placed','queued'].includes(o.status)) return;
    o.status = 'cancelled'; o.at.cancelled = nowT();
    refund(o, 'you cancelled'); render(); toast('Cancelled and refunded');
  },
  /* rider */
  rTake(id){ const o = S.orders.find(x => x.id === +id); if(o && o.status === 'ready'){ o.rider = 'Tunde A.'; setStatus(o, 'pickedup'); render(); } },
  rDone(id){
    const o = S.orders.find(x => x.id === +id); if(!o) return;
    if(o.by !== 'you'){ S.riderEarn += o.riderPay; S.riderDone += 1; }
    setStatus(o, 'delivered'); render(); toast(`Delivered. ${N(o.riderPay)} added to your earnings`);
  },
  /* vendor */
  vAccept(id){ const o = S.orders.find(x => x.id === +id); if(o){ setStatus(o, 'accepted'); render(); } },
  vReject(id){ const o = S.orders.find(x => x.id === +id); if(o){ setStatus(o, 'rejected'); render(); } },
  vPrep(id){ const o = S.orders.find(x => x.id === +id); if(o){ setStatus(o, 'preparing'); render(); } },
  vReady(id){ const o = S.orders.find(x => x.id === +id); if(o){ setStatus(o, 'ready'); render(); } },
  vTab(id){ S.vendorTab = id; render(); },
  vOpen(id, el){ S.closed[S.vendorView] = !el.checked; render(); toast(el.checked ? 'Now accepting orders' : 'Marked closed. Students can\'t order'); },
  stock(id, el){ S.out[id] = !el.checked; render(); },
  /* admin */
  chk(id){ S.checklist[+id].d = !S.checklist[+id].d; render(); },
  publish(){
    const c = S.compose;
    if(!c.title.trim()){ toast('Add a title first'); return; }
    S.ann.unshift({title:c.title.trim(), body:c.body.trim() || 'Details to follow.', aud:c.aud, from:'University Management', t:'Just now'});
    S.compose = {title:'', body:'', aud:'Everyone'};
    render(); toast(`Published to ${c.aud.toLowerCase()}`);
  }
};

document.addEventListener('click', e => {
  const r = e.target.closest('[data-role]');
  if(r){
    const nr = r.dataset.role; S.role = nr;
    if(PERSONAS.includes(nr) && S.persona !== nr){ S.persona = nr; S.screen = S.tab = 'home'; S.cart = {vendorId:null, q:{}}; S.vendorId = null; S.activeId = null; }
    S.sheet = null; render(); window.scrollTo({top:0});
    if(GATED.includes(nr) && !S.session[nr] && !S.launched[nr]) setTimeout(() => { if(S.role === nr && !S.launched[nr]){ S.launched[nr] = true; render(); } }, 2200);
    return;
  }
  const el = e.target.closest('[data-act]');
  if(!el || el.tagName === 'INPUT') return;
  const fn = ACT[el.dataset.act]; if(fn) fn(el.dataset.id, el);
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.file === 'avatar'){ handleAvatar(t.files && t.files[0], S.user.email); t.value = ''; return; }
  if(t.dataset.file === 'roleAvatar'){ handleAvatar(t.files && t.files[0], roleIdentity().key); t.value = ''; return; }
  if(t.dataset.file === 'postMedia'){ handlePostMedia(t.files && t.files[0]); t.value = ''; return; }
  if(t.tagName === 'INPUT' && t.dataset.act){ const fn = ACT[t.dataset.act]; if(fn) fn(t.dataset.id, t); return; }
  if(t.dataset.reason){ S.reason[t.dataset.reason] = t.value; return; }
  if(t.dataset.facpick){ S.facPick[t.dataset.facpick] = t.value; return; }
  if(t.dataset.sel === 'vendor'){ S.vendorView = t.value; render(); }
  if(t.dataset.sel === 'provider'){ S.providerView = t.value; render(); }
  if(t.dataset.sel === 'seller'){ S.sellerView = t.value; render(); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.model; if(k) S.compose[k] = e.target.value;
  const f = e.target.dataset.form; if(f){ S.form[f] = e.target.value; }
  if(e.target.dataset.note) S.notice.note = e.target.value;
  if(e.target.hasAttribute && e.target.hasAttribute('data-ratecomment')) S.rateForm.comment = e.target.value;
  if(e.target.hasAttribute && e.target.hasAttribute('data-chatmsg')) S.chatDraft = e.target.value;
  if(e.target.dataset.gate) S.gate[e.target.dataset.gate] = e.target.value;
  if(e.target.dataset.forgot) S.forgot[e.target.dataset.forgot] = e.target.value;
  if(e.target.dataset.facfield) S.facForm[e.target.dataset.facfield] = e.target.value;
  if(e.target.dataset.svcfield) S.svcForm[e.target.dataset.svcfield] = e.target.value;
  if(e.target.hasAttribute && e.target.hasAttribute('data-postfield')) S.postDraft = e.target.value;
  if(e.target.hasAttribute && e.target.hasAttribute('data-commentfield')) S.commentDraft = e.target.value;
  if(e.target.hasAttribute && e.target.hasAttribute('data-dmfield')) S.dmDraft = e.target.value;
  if(e.target.hasAttribute && e.target.hasAttribute('data-groupfield')) S.groupDraft = e.target.value;
  if(e.target.hasAttribute && e.target.hasAttribute('data-peoplesearch')) liveSearchInput(e.target, 'peopleSearch', 'data-peoplesearch');
  if(e.target.hasAttribute && e.target.hasAttribute('data-foodsearch')) liveSearchInput(e.target, 'foodSearch', 'data-foodsearch');
  if(e.target.hasAttribute && e.target.hasAttribute('data-svcsearch')) liveSearchInput(e.target, 'svcSearch', 'data-svcsearch');
  if(e.target.hasAttribute && e.target.hasAttribute('data-mktsearch')) liveSearchInput(e.target, 'mktSearch', 'data-mktsearch');
  if(e.target.hasAttribute && e.target.hasAttribute('data-facmsg')) S.facComment = e.target.value;
});
function handleAvatar(file, key){
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Choose an image file'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 256, c = document.createElement('canvas'); c.width = c.height = size;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
      AV[key] = c.toDataURL('image/jpeg', .85); saveAV();
      render(); toast('Display picture updated');
    };
    img.onerror = () => toast('That image couldn\'t be read');
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

document.getElementById('off').addEventListener('change', e => {
  S.offline = e.target.checked;
  if(!S.offline){
    const q = S.orders.filter(o => o.status === 'queued');
    q.forEach(o => { o.status = 'placed'; o.at.placed = nowT(); });
    if(q.length) toast(`Back online. ${q.length} saved order${q.length > 1 ? 's' : ''} sent to the kitchen`);
  }
  render();
});
document.getElementById('reset').addEventListener('click', () => {
  try{ localStorage.removeItem('eden-auth'); }catch(e){}
  S = initState(); startSplash();
  document.getElementById('off').checked = false;
  render(); toast('Demo reset');
});
function startSplash(){ setTimeout(() => { if(S.stage === 'splash'){ S.stage = 'welcome'; if(S.role === 'student') render(); } }, 2600); }
const returning = loadAuth();
render();
startSplash();
if(returning) toast(S.persona !== 'student' && S.users[S.persona] ? `Welcome back, ${S.users[S.persona].name.split(' ')[0]}` : 'Welcome back');
</script>
